global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: agent
    static_configs: [{ targets: ["agent:9100"] }]
  - job_name: collector
    static_configs: [{ targets: ["collector:9100"] }]
  - job_name: indexer
    static_configs: [{ targets: ["indexer:9100"] }]
  - job_name: query-api
    static_configs: [{ targets: ["query-api:8080"] }]
  - job_name: tail
    static_configs: [{ targets: ["tail:8082"] }]
  - job_name: alerter
    static_configs: [{ targets: ["alerter:9100"] }]
