name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: install buf
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-$(uname -s)-$(uname -m)" -o "$HOME/.local/bin/buf"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: buf lint
        run: buf lint
      - name: generated code is up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate -o "$RUNNER_TEMP/regen"
          diff -r gen "$RUNNER_TEMP/regen/gen"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: integration tests (Kafka and OpenSearch via testcontainers)
        run: go test -race -count=1 -tags=integration -timeout=15m ./integration/...

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent, collector, indexer, queryapi, tail, alerter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: logplat/${{ matrix.service }}:ci
          push: false
