# Chaos overlay: routes the three network hops through Toxiproxy so tests can
# inject faults, and turns off restart policies so a killed container stays
# down until the test starts it again.
# Use with: docker compose -f compose.yaml -f compose.chaos.yaml ...
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"
    volumes:
      - ./deploy/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro

  kafka:
    restart: "no"
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094,PROXIED://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094,PROXIED://toxiproxy:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PROXIED:PLAINTEXT

  opensearch:
    restart: "no"

  collector:
    restart: "no"
    depends_on:
      toxiproxy: { condition: service_started }
    environment:
      KAFKA_BROKERS: toxiproxy:19092

  indexer:
    restart: "no"
    depends_on:
      toxiproxy: { condition: service_started }
    environment:
      KAFKA_BROKERS: toxiproxy:19092
      OPENSEARCH_ADDRS: http://toxiproxy:19200

  agent:
    restart: "no"
    depends_on:
      toxiproxy: { condition: service_started }
    environment:
      COLLECTOR_ADDR: toxiproxy:7071
